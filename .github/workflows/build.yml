name: Refresh data and build site

on:
  schedule:
    - cron: "41 11 * * *"   # daily, ~7:41am ET
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/**"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check source files
        id: ready
        run: |
          for f in scripts/build.mjs data/funds.csv content/funds.json assets/site.css assets/app.js; do [ -f "$f" ] || { echo "Missing $f, skipping build"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }; done
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Pull the latest fund data from the Google Sheet
        if: steps.ready.outputs.ok == 'true'
        run: |
          SHEET=$(grep -oE '^const SHEET="[^"]*"' scripts/build.mjs | sed -E 's/^const SHEET="(.*)"/\1/')
          if [ -z "$SHEET" ]; then echo "No sheet URL set, using data/funds.csv"; exit 0; fi
          curl -sSL --retry 3 -m 60 "$SHEET" -o /tmp/funds.csv || exit 0
          if head -1 /tmp/funds.csv | grep -qi 'ticker\|symbol'; then mv /tmp/funds.csv data/funds.csv; echo "updated funds.csv"; else echo "::warning::sheet did not return CSV, keeping previous snapshot"; fi
      - name: Build site
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/build.mjs
      - name: Render social card
        if: steps.ready.outputs.ok == 'true' && hashFiles('robotetfs.png') == ''
        run: |
          google-chrome --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=1200,628 --screenshot="$PWD/robotetfs.png" "file://$PWD/scripts/og-card.html" || echo "::warning::social card render failed"
      - name: Commit
        if: steps.ready.outputs.ok == 'true'
        run: |
          git config user.name "robotetfs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily data refresh and rebuild [skip ci]"
          git pull --rebase origin main || true
          git push
